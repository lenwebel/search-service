[package]
name = "search-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.5"
form_urlencoded = "1.2.2"
futures = "0.3.34"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
object_store = { version = "0.14.2", features = ["azure"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
ulid = "3.0.0"
unicode-segmentation = "1.13.3"
url = "2.5.8"
zstd = "0.14.4"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"

[profile.release]
debug = "line-tables-only"
# Whole-program optimisation: slower builds, faster hot loops.
lto = "fat"
codegen-units = 1
